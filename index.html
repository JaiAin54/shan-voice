<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shan Voice – လၢႆႈတူဝ်လိၵ်ႈတႆးပဵၼ်သဵင်</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --primary: #22A06B;
            --primary-hover: #168653;
            --primary-light: #E8F5EE;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --border: #E2E8F0;
        }
        * { font-family: 'Noto Sans Thai', sans-serif; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text-primary); margin: 0; min-height: 100vh; }
        .transition-all-smooth { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        .card {
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease;
        }
        .card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; }

        /* Audio Waveform Animation */
        .wave-bar {
            width: 3px;
            background-color: var(--primary);
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(1) { animation-delay: 0.1s; height: 12px; }
        .wave-bar:nth-child(2) { animation-delay: 0.3s; height: 22px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 16px; }
        .wave-bar:nth-child(4) { animation-delay: 0.4s; height: 26px; }
        .wave-bar:nth-child(5) { animation-delay: 0.15s; height: 14px; }

        @keyframes wave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        .custom-audio-player {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: #F8FAFC;
            border-radius: 16px;
            border: 1px solid #E2E8F0;
        }
        .play-btn-large {
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--primary); color: white; border: none;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(34, 160, 107, 0.3);
        }
        .play-btn-large:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: scale(1.06);
        }
        .play-btn-large:active:not(:disabled) {
            transform: scale(0.95);
        }
        .play-btn-large:disabled {
            background: #94A3B8; cursor: not-allowed; opacity: 0.6; box-shadow: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

        // ============================================
        // GLOBAL AUDIO CONTROLLER (ป้องกันเสียงเล่นซ้อน)
        // ============================================
        const GlobalAudio = {
            currentAudio: null,
            currentStopCallback: null,

            play(audioInstance, onStopCallback) {
                if (this.currentAudio && this.currentAudio !== audioInstance) {
                    this.currentAudio.pause();
                    this.currentAudio.currentTime = 0;
                    if (this.currentStopCallback) {
                        this.currentStopCallback();
                    }
                }
                this.currentAudio = audioInstance;
                this.currentStopCallback = onStopCallback;
            },

            stop() {
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio.currentTime = 0;
                    if (this.currentStopCallback) {
                        this.currentStopCallback();
                    }
                    this.currentAudio = null;
                    this.currentStopCallback = null;
                }
            }
        };

        // ============================================
        // TTS SERVICE – Gradio SSE API (คงเดิม 100%)
        // ============================================
        const TtsService = {
            API_BASE_URL: 'https://innkl24-shan-tts-api.hf.space',

            async _readSSE(streamUrl) {
                const response = await fetch(streamUrl);
                if (!response.ok) throw new Error(`Stream error: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    let eventType = '';
                    for (const line of lines) {
                        if (line.startsWith('event: ')) eventType = line.slice(7).trim();
                        if (line.startsWith('data: ') && eventType === 'complete') {
                            reader.cancel();
                            return JSON.parse(line.slice(6));
                        }
                    }
                }
                throw new Error('ไม่ได้รับผลลัพธ์จาก SSE stream');
            },

            async generateSpeech(text, speed = 'normal') {
                const rateMap = { slow: 0.7, normal: 1.0, fast: 1.3 };
                const speedValue = rateMap[speed] || 1.0;

                const callUrl = `${this.API_BASE_URL}/gradio_api/call/text_to_speech_api`;
                const payload = { data: [text, null, speedValue] };

                const response = await fetch(callUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    mode: 'cors',
                });

                if (!response.ok) {
                    const err = await response.text();
                    throw new Error(`เซิร์ฟเวอร์ตอบกลับ ${response.status}`);
                }

                const { event_id } = await response.json();
                const streamUrl = `${this.API_BASE_URL}/gradio_api/call/text_to_speech_api/${event_id}`;
                const output = await this._readSSE(streamUrl);

                let audioPath = null;
                if (Array.isArray(output) && output.length > 0) {
                    const first = output[0];
                    if (typeof first === 'string') {
                        audioPath = first;
                    } else if (first && typeof first === 'object') {
                        audioPath = first.url || first.path || first.name || null;
                    }
                } else if (output && typeof output === 'object' && !Array.isArray(output)) {
                    audioPath = output.url || output.path || output.name || null;
                }

                if (!audioPath) throw new Error('ဢမ်ႇႁၼ်လိင်ႉၾၢႆႇသဵင်');

                let audioUrl;
                if (audioPath.startsWith('http')) {
                    audioUrl = audioPath;
                } else {
                    const cleanPath = audioPath.startsWith('/') ? audioPath : '/' + audioPath;
                    audioUrl = `${this.API_BASE_URL}/file=${encodeURIComponent(cleanPath)}`;
                }

                return audioUrl;
            },

            async downloadAudio(audioUrl, filename = 'shan-voice.wav') {
                try {
                    const response = await fetch(audioUrl);
                    if (!response.ok) throw new Error('Download failed');
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    throw new Error('တၢဝ်းလူတ်ႇၾၢႆႇသဵင်ဢမ်ႇလႆႈ');
                }
            },
        };

        // ============================================
        // LOCAL STORAGE
        // ============================================
        const StorageService = {
            HISTORY_KEY: 'shan_voice_history',
            SETTINGS_KEY: 'shan_voice_settings',
            getHistory() {
                try { return JSON.parse(localStorage.getItem(this.HISTORY_KEY)) || []; } catch { return []; }
            },
            saveHistory(h) {
                try { localStorage.setItem(this.HISTORY_KEY, JSON.stringify(h.slice(0, 15))); } catch {}
            },
            getSettings() {
                try { return JSON.parse(localStorage.getItem(this.SETTINGS_KEY)) || { defaultSpeed: 'normal' }; } catch { return { defaultSpeed: 'normal' }; }
            },
            saveSettings(s) {
                try { localStorage.setItem(this.SETTINGS_KEY, JSON.stringify(s)); } catch {}
            },
        };

        // ============================================
        // ICONS (Minimal Modern Icons)
        // ============================================
        const Icons = {
            Home: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
            TextToSpeech: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>,
            AudioFile: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>,
            Settings: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>,
            Play: ({c="w-5 h-5"}) => <svg className={c} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
            Pause: ({c="w-5 h-5"}) => <svg className={c} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
            Download: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>,
            Trash: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            Waveform: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M2 12h2m2-4v8m4-12v16m4-12v8m4-8v8m4-4v8m2-4h2"/></svg>,
            Check: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>,
            Alert: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.994c-.77-1.333-2.694-1.333-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>,
            Clear: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>,
            Menu: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>,
            Close: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>,
            Info: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            Clock: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            User: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
            Edit: ({c="w-5 h-5"}) => <svg className={c} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>,
        };

        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        const ToastContext = createContext(null);
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const idRef = useRef(0);
            const addToast = useCallback((message, type = 'info') => {
                const id = ++idRef.current;
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            }, []);
            const removeToast = useCallback((id) => setToasts(prev => prev.filter(t => t.id !== id)), []);
            return (
                <ToastContext.Provider value={{ addToast, removeToast }}>
                    {children}
                    <div className="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`flex items-center gap-3 p-4 rounded-xl shadow-lg border transition-all ${toast.type==='success'?'bg-white border-green-200 text-green-800':toast.type==='error'?'bg-white border-red-200 text-red-800':'bg-white border-slate-200 text-slate-800'}`}>
                                {toast.type==='success'?<Icons.Check c="w-5 h-5 text-green-500"/>:toast.type==='error'?<Icons.Alert c="w-5 h-5 text-red-500"/>:<Icons.Info c="w-5 h-5 text-slate-500"/>}
                                <p className="text-sm font-medium flex-1">{toast.message}</p>
                                <button onClick={()=>removeToast(toast.id)} className="text-slate-400 hover:text-slate-600"><Icons.Close c="w-4 h-4"/></button>
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };
        const useToast = () => useContext(ToastContext);

        // ============================================
        // ADVANCED AUDIO PLAYER WITH CLIENT-SIDE SPEED CONTROL
        // ============================================
        const CustomAudioPlayer = ({ src, filename, onDownload }) => {
            const audioRef = useRef(new Audio());
            const progressRef = useRef(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [playbackRate, setPlaybackRate] = useState(1.0);
            const [isReady, setIsReady] = useState(false);

            useEffect(() => {
                const audio = audioRef.current;
                if (!src) return;

                audio.pause();
                setIsPlaying(false);
                setIsReady(false);
                setCurrentTime(0);

                audio.src = src;
                audio.preload = 'metadata';

                const onLoaded = () => {
                    if (audio.duration && isFinite(audio.duration)) setDuration(audio.duration);
                    setIsReady(true);
                };
                const onTime = () => setCurrentTime(audio.currentTime);
                const onEnd = () => {
                    setIsPlaying(false);
                    setCurrentTime(0);
                };

                audio.addEventListener('loadedmetadata', onLoaded);
                audio.addEventListener('timeupdate', onTime);
                audio.addEventListener('ended', onEnd);

                return () => {
                    audio.pause();
                    audio.removeEventListener('loadedmetadata', onLoaded);
                    audio.removeEventListener('timeupdate', onTime);
                    audio.removeEventListener('ended', onEnd);
                };
            }, [src]);

            const togglePlay = () => {
                const audio = audioRef.current;
                if (!audio || !isReady) return;

                if (isPlaying) {
                    GlobalAudio.stop();
                } else {
                    GlobalAudio.play(audio, () => setIsPlaying(false));
                    audio.playbackRate = playbackRate;
                    audio.play().then(() => setIsPlaying(true)).catch(console.error);
                }
            };

            const changeSpeed = (rate) => {
                setPlaybackRate(rate);
                if (audioRef.current) {
                    audioRef.current.playbackRate = rate;
                }
            };

            const seek = (e) => {
                const bar = progressRef.current, audio = audioRef.current;
                if (!bar || !audio || !duration) return;
                const rect = bar.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                audio.currentTime = pct * duration;
                setCurrentTime(audio.currentTime);
            };

            const fmt = (t) => {
                if (!t || !isFinite(t)) return '0:00';
                const m = Math.floor(t / 60), s = Math.floor(t % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const pct = duration > 0 ? (currentTime / duration) * 100 : 0;

            return (
                <div className="custom-audio-player">
                    <div className="flex items-center gap-4">
                        <button onClick={togglePlay} disabled={!isReady} className="play-btn-large" title={isPlaying ? 'ၵိုတ်း' : 'လဵၼ်ႈ'}>
                            {isPlaying ? <Icons.Pause c="w-6 h-6"/> : <Icons.Play c="w-6 h-6 ml-0.5"/>}
                        </button>

                        <div className="flex-1 space-y-1.5">
                            <div className="flex justify-between text-xs font-semibold text-slate-500">
                                <span>{fmt(currentTime)}</span>
                                {isPlaying && (
                                    <div className="flex items-center gap-1 h-4">
                                        <div className="wave-bar"></div>
                                        <div className="wave-bar"></div>
                                        <div className="wave-bar"></div>
                                        <div className="wave-bar"></div>
                                        <div className="wave-bar"></div>
                                    </div>
                                )}
                                <span>{fmt(duration)}</span>
                            </div>
                            <div ref={progressRef} onClick={seek} className="h-2 bg-slate-200 rounded-full cursor-pointer relative overflow-hidden">
                                <div className="h-full bg-[#22A06B] rounded-full transition-all duration-75" style={{ width: `${pct}%` }}/>
                            </div>
                        </div>
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t border-slate-200/60">
                        {/* SPEED SELECTOR CONTROLLER */}
                        <div className="flex items-center gap-1 bg-slate-200/60 p-1 rounded-xl">
                            {[0.75, 1.0, 1.25, 1.5].map(rate => (
                                <button key={rate} onClick={() => changeSpeed(rate)}
                                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${playbackRate === rate ? 'bg-white text-[#22A06B] shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
                                    {rate === 1.0 ? '1x (ปกติ)' : `${rate}x`}
                                </button>
                            ))}
                        </div>

                        <button onClick={() => onDownload(src, filename)} className="p-2 text-slate-600 hover:text-[#22A06B] hover:bg-white rounded-xl transition-all" title="တၢဝ်းလူတ်ႇ">
                            <Icons.Download c="w-5 h-5"/>
                        </button>
                    </div>
                </div>
            );
        };

        // ============================================
        // COMPONENTS
        // ============================================
        const CharacterCounter = ({ count, max = 500 }) => {
            const color = count > max ? 'text-red-600 font-bold' : count >= max * 0.9 ? 'text-amber-500 font-bold' : 'text-slate-400';
            return <span className={`text-xs font-medium ${color}`}>{count.toLocaleString()} / {max.toLocaleString()} တူဝ်လိၵ်ႈ</span>;
        };

        const AudioResultCard = ({ audioUrl, filename, onDownload }) => {
            return (
                <div className="card p-6 bg-white border-l-4 border-l-[#22A06B]">
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
                                <Icons.Check c="w-5 h-5"/>
                            </div>
                            <h3 className="font-bold text-slate-800">သၢင်ႈသဵင်ယဝ်ႉယဝ်ႉ</h3>
                        </div>
                        <span className="px-3 py-1 bg-green-50 text-[#22A06B] border border-green-200 rounded-full text-xs font-bold">
                            Shan Voice
                        </span>
                    </div>
                    <CustomAudioPlayer src={audioUrl} filename={filename} onDownload={onDownload}/>
                </div>
            );
        };

        const AudioHistory = ({ history, onDownload, onDelete, onRestore }) => {
            const [playingId, setPlayingId] = useState(null);
            const audioRef = useRef(null);

            const handleItemPlay = (item) => {
                if (playingId === item.id) {
                    GlobalAudio.stop();
                    setPlayingId(null);
                } else {
                    const audio = new Audio(item.audioUrl);
                    GlobalAudio.play(audio, () => setPlayingId(null));
                    audio.play().then(() => setPlayingId(item.id)).catch(console.error);
                }
            };

            if (!history.length) return (
                <div className="card p-8 text-center">
                    <Icons.AudioFile c="w-10 h-10 text-slate-300 mx-auto mb-3"/>
                    <h3 className="text-slate-500 font-bold text-sm">ဢမ်ႇပႆႇမီးၾၢႆႇသဵင်</h3>
                </div>
            );

            return (
                <div className="space-y-3">
                    {history.map(item => (
                        <div key={item.id} className="card p-4 flex items-center justify-between gap-3 hover:border-slate-300">
                            <div className="flex-1 min-w-0 cursor-pointer" onClick={() => onRestore && onRestore(item.originalText || item.textPreview)}>
                                <p className="font-semibold text-slate-800 text-sm truncate">{item.textPreview}</p>
                                <p className="text-xs text-slate-400 mt-1">{item.date}</p>
                            </div>
                            
                            {/* Minimal Icon Controls */}
                            <div className="flex items-center gap-1">
                                <button onClick={() => onRestore && onRestore(item.originalText || item.textPreview)} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all" title="ၸႂ်ႉၶေႃႈၵႂၢမ်းၼႆႉ">
                                    <Icons.Edit c="w-4 h-4"/>
                                </button>
                                <button onClick={() => handleItemPlay(item)} className={`p-2 rounded-lg transition-all ${playingId === item.id ? 'bg-[#22A06B] text-white' : 'text-slate-400 hover:text-[#22A06B] hover:bg-green-50'}`} title={playingId === item.id ? 'ၵိုတ်း' : 'လဵၼ်ႈ'}>
                                    {playingId === item.id ? <Icons.Pause c="w-4 h-4"/> : <Icons.Play c="w-4 h-4"/>}
                                </button>
                                <button onClick={() => onDownload(item.audioUrl, item.filename)} className="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-all" title="တၢဝ်းလူတ်ႇ">
                                    <Icons.Download c="w-4 h-4"/>
                                </button>
                                <button onClick={() => onDelete(item.id)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all" title="မွတ်ႇ">
                                    <Icons.Trash c="w-4 h-4"/>
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // ============================================
        // PAGES
        // ============================================
        const TextToSpeechPage = () => {
            const [text, setText] = useState('');
            const [loading, setLoading] = useState(false);
            const [elapsedTime, setElapsedTime] = useState(0);
            const [audioResult, setAudioResult] = useState(null);
            const [error, setError] = useState(null);
            const [history, setHistory] = useState(StorageService.getHistory());
            const { addToast } = useToast();

            // Progress Timer counter
            useEffect(() => {
                let timer;
                if (loading) {
                    setElapsedTime(0);
                    timer = setInterval(() => setElapsedTime(prev => prev + 1), 1000);
                } else {
                    clearInterval(timer);
                }
                return () => clearInterval(timer);
            }, [loading]);

            useEffect(() => {
                const restored = sessionStorage.getItem('shan_restore_text');
                if (restored) {
                    setText(restored);
                    sessionStorage.removeItem('shan_restore_text');
                }
            }, []);

            const count = text.length;
            const canGenerate = count > 0 && count <= 500 && !loading;

            const handleClear = () => { setText(''); setAudioResult(null); setError(null); };

            const handleGenerate = async () => {
                if (!canGenerate) return;
                setLoading(true); setError(null); setAudioResult(null);
                try {
                    const settings = StorageService.getSettings();
                    const audioUrl = await TtsService.generateSpeech(text, settings.defaultSpeed || 'normal');
                    const filename = `shan-voice-${Date.now()}.wav`;
                    
                    setAudioResult({ url: audioUrl, filename });

                    const newEntry = {
                        id: Date.now(), 
                        filename, 
                        textPreview: text.length > 50 ? text.slice(0, 50) + '...' : text,
                        originalText: text,
                        audioUrl, 
                        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    const updated = [newEntry, ...history].slice(0, 15);
                    setHistory(updated);
                    StorageService.saveHistory(updated);
                    addToast('သၢင်ႈသဵင်ယဝ်ႉယဝ်ႉ', 'success');
                } catch (err) {
                    setError(err.message || 'သၢင်ႈသဵင်ဢမ်ႇလႆႈ');
                    addToast('သၢင်ႈသဵင်ဢမ်ႇလႆႈ', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleDownload = async (url, filename) => {
                try { 
                    await TtsService.downloadAudio(url, filename); 
                    addToast('တၢဝ်းလူတ်ႇယဝ်ႉယဝ်ႉ', 'success'); 
                } catch { 
                    addToast('တၢဝ်းလူတ်ႇဢမ်ႇလႆႈ', 'error'); 
                }
            };

            const handleDelete = (id) => {
                const updated = history.filter(i => i.id !== id);
                setHistory(updated); 
                StorageService.saveHistory(updated);
                addToast('မွတ်ႇယဝ်ႉ', 'info');
            };

            const handleRestore = (restoreText) => {
                if (!restoreText) return;
                setText(restoreText);
                setAudioResult(null);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 space-y-6">
                            <div className="card p-6">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-slate-800">ၶေႃႈၵႂၢမ်းၸဝ်ႈၵဝ်ႇ</h3>
                                    <CharacterCounter count={count}/>
                                </div>
                                <textarea 
                                    value={text} 
                                    onChange={e => setText(e.target.value.slice(0, 500))} 
                                    placeholder="ပေႃႉလိၵ်ႈတႆး/ၵူးဢဝ်မႃးလႆႈ"
                                    className="w-full h-64 p-4 border border-slate-200 rounded-2xl text-base text-slate-800 focus:ring-2 focus:ring-[#22A06B] focus:border-transparent transition-all outline-none resize-none"
                                    disabled={loading} 
                                    maxLength={500}
                                />
                                <div className="flex justify-between items-center mt-3">
                                    <button onClick={handleClear} disabled={loading || !text} className="text-xs font-semibold text-slate-400 hover:text-slate-600 flex items-center gap-1 disabled:opacity-30">
                                        <Icons.Clear c="w-4 h-4"/> လၢင်ႉၶေႃႈၵႂၢမ်း
                                    </button>
                                </div>
                            </div>

                            {/* GENERATE BUTTON WITH PROGRESS TIMER */}
                            <button 
                                onClick={handleGenerate} 
                                disabled={!canGenerate}
                                className={`w-full py-4 px-6 rounded-2xl font-bold text-white text-lg transition-all flex items-center justify-center gap-3 ${loading ? 'bg-slate-700 cursor-wait' : !canGenerate ? 'bg-slate-300 cursor-not-allowed' : 'bg-[#22A06B] hover:bg-[#168653] shadow-lg shadow-green-900/10 active:scale-[0.99]'}`}
                            >
                                {loading ? (
                                    <>
                                        <span className="spinner w-5 h-5 border-2 border-white border-t-transparent rounded-full"></span>
                                        <span>တိုၵ်ႉသၢင်ႈသဵင်ယူႇ... ({elapsedTime}s)</span>
                                    </>
                                ) : (
                                    <>
                                        <Icons.Waveform c="w-6 h-6"/>
                                        <span>သၢင်ႈသဵင်</span>
                                    </>
                                )}
                            </button>

                            {error && (
                                <div className="card p-4 bg-red-50 border-red-200 flex items-center gap-3 text-red-700">
                                    <Icons.Alert c="w-5 h-5 flex-shrink-0"/>
                                    <p className="text-sm font-medium flex-1">{error}</p>
                                </div>
                            )}

                            {audioResult && <AudioResultCard audioUrl={audioResult.url} filename={audioResult.filename} onDownload={handleDownload}/>}
                        </div>

                        {/* RECENT HISTORY SIDEBAR */}
                        <div className="space-y-6">
                            <div className="card p-6">
                                <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <Icons.Clock c="w-5 h-5 text-[#22A06B]"/>
                                    <span>ၾၢႆႇသဵင်ၵမ်းလိုၼ်းသုတ်း</span>
                                </h3>
                                <AudioHistory history={history.slice(0, 5)} onDownload={handleDownload} onDelete={handleDelete} onRestore={handleRestore}/>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MyAudioPage = () => {
            const [history, setHistory] = useState(StorageService.getHistory());
            const [searchTerm, setSearchTerm] = useState('');
            const { addToast } = useToast();

            const filtered = history.filter(i => i.textPreview.includes(searchTerm));

            const handleDownload = async (url, filename) => {
                try { await TtsService.downloadAudio(url, filename); addToast('တၢဝ်းလူတ်ႇယဝ်ႉယဝ်ႉ', 'success'); }
                catch { addToast('တၢဝ်းလူတ်ႇဢမ်ႇလႆႈ', 'error'); }
            };

            const handleDelete = (id) => {
                const u = history.filter(i => i.id !== id);
                setHistory(u);
                StorageService.saveHistory(u);
                addToast('မွတ်ႇယဝ်ႉ', 'info');
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8">
                    <h1 className="text-2xl font-bold text-slate-800 mb-6">ၾၢႆႇသဵင်ၶႃႈ</h1>
                    <div className="mb-6">
                        <input 
                            type="text" 
                            placeholder="တီႈႁႃၾၢႆႇသဵင်..." 
                            value={searchTerm} 
                            onChange={e => setSearchTerm(e.target.value)}
                            className="w-full md:w-1/2 px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-[#22A06B] outline-none"
                        />
                    </div>
                    <AudioHistory history={filtered} onDownload={handleDownload} onDelete={handleDelete}/>
                </div>
            );
        };

        const SettingsPage = () => {
            const [settings, setSettings] = useState(StorageService.getSettings());
            const { addToast } = useToast();

            const save = () => {
                StorageService.saveSettings(settings);
                addToast('ၵဵပ်းသိပ်းလွင်ႈမူၼ်ႉမေးယဝ်ႉ', 'success');
            };

            return (
                <div className="max-w-xl mx-auto px-4 py-8">
                    <h1 className="text-2xl font-bold text-slate-800 mb-6">တီႈမေး</h1>
                    <div className="card p-6 space-y-6">
                        <div>
                            <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">တၢင်းဝႆးသဵင်ငဝ်ႈတိုၼ်း</label>
                            <select 
                                value={settings.defaultSpeed} 
                                onChange={e => setSettings({ ...settings, defaultSpeed: e.target.value })}
                                className="w-full p-3 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-[#22A06B]"
                            >
                                <option value="slow">ထိူင်း (Slow)</option>
                                <option value="normal">ပၢၼ်ၵၢင် (Normal)</option>
                                <option value="fast">ဝႆး (Fast)</option>
                            </select>
                        </div>
                        <button onClick={save} className="w-full py-3 bg-[#22A06B] hover:bg-[#168653] text-white font-bold rounded-xl transition-all">
                            မၵ်းမၼ်ႈလွင်ႈမူၼ်ႉမေး
                        </button>
                    </div>
                </div>
            );
        };

        // ============================================
        // LAYOUT
        // ============================================
    
        const AppLayout = () => {
            const [page, setPage] = useState('tts');
            const [isOpen, setIsOpen] = useState(false); // สถานะเปิด/ปิด Sidebar

            const nav = [
                { id: 'tts', label: 'လၢႆႈတူဝ်လိၵ်ႈပဵၼ်သဵင်', icon: <Icons.TextToSpeech/> },
                { id: 'audio', label: 'ၾၢႆႇသဵင်', icon: <Icons.AudioFile/> },
                { id: 'settings', label: 'တီႈမေး', icon: <Icons.Settings/> },
            ];

            const handleNavClick = (id) => {
                setPage(id);
                setIsOpen(false); // เมื่อกดเลือกเมนูแล้ว ให้ซ่อน Sidebar อัตโนมัติ
            };

            return (
                <div className="flex min-h-screen relative overflow-x-hidden">
                    {/* ปุ่ม Hamburger Toggle (จะลอยอยู่มุมซ้ายบนตลอดเวลา) */}
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="fixed top-4 left-4 z-50 p-2.5 bg-white border border-slate-200 text-slate-700 rounded-xl shadow-md hover:bg-slate-50 active:scale-95 transition-all"
                        title="เปิด/ปิด เมนู"
                    >
                        {isOpen ? <Icons.Close c="w-6 h-6"/> : <Icons.Menu c="w-6 h-6"/>}
                    </button>

                    {/* ฉากหลังสีดำโปร่งแสง (Overlay) สำหรับกดปิดเมื่อเปิด Sidebar บนมือถือ */}
                    {isOpen && (
                        <div 
                            onClick={() => setIsOpen(false)}
                            className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 transition-opacity"
                        />
                    )}

                    {/* SIDEBAR (เลื่อน เข้า-ออก ตามสถานะ isOpen) */}
                    <aside className={`w-64 bg-white border-r border-slate-200 fixed h-full z-40 flex flex-col transition-transform duration-300 ease-in-out ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 pt-16 flex items-center gap-3 border-b border-slate-100">
                            <div className="w-10 h-10 bg-[#22A06B] rounded-2xl flex items-center justify-center text-white shadow-md shadow-green-900/10 flex-shrink-0">
                                <Icons.Waveform c="w-6 h-6"/>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-slate-800 text-lg leading-none">Shan Voice</h1>
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Text to Speech</span>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-1">
                            {nav.map(item => (
                                <button key={item.id} onClick={() => handleNavClick(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${page === item.id ? 'bg-[#E8F5EE] text-[#22A06B]' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}`}>
                                    {item.icon} {item.label}
                                </button>
                            ))}
                        </nav>
                    </aside>

                    {/* MAIN CONTENT (พื้นที่ทำงานหลัก ได้พื้นที่เต็มจอ 100%) */}
                    <main className="flex-1 bg-slate-50 min-h-screen pt-12 md:pt-4">
                        {page === 'tts' && <TextToSpeechPage/>}
                        {page === 'audio' && <MyAudioPage/>}
                        {page === 'settings' && <SettingsPage/>}
                    </main>
                </div>
            );
        };

        const App = () => (
            <ToastProvider>
                <AppLayout/>
            </ToastProvider>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
